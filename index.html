<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script>
    document.body.dataset.theme = localStorage.getItem('tetris-theme') || 'dark';
  </script>
  <div class="wrapper">
    <div class="header-row">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar entre modo claro y oscuro">🌙</button>
      <button id="sound-toggle" type="button" aria-label="Silenciar sonido" title="Activar o silenciar el sonido">🔊</button>
    </div>
    <div class="game-container">
      <aside class="panel panel-left">
        <div class="panel-section">
          <span class="label">HOLD</span>
          <canvas id="hold-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section energy" id="energy-section">
          <span class="label">ENERGÍA</span>
          <div class="energy-bar"><div id="energy-fill"></div></div>
          <span class="energy-hint">Pulsa <kbd>E</kbd></span>
        </div>

        <div class="panel-section">
          <span class="label" id="mode-label">CLÁSICO</span>
          <span class="goal" id="goal-text">Libre</span>
        </div>

        <div class="panel-section hidden" id="queue-section">
          <span class="label">PRÓXIMAS</span>
          <canvas id="queue-canvas" width="60" height="240"></canvas>
        </div>
      </aside>

      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="stats-row">
          <div class="panel-section">
            <span class="label">LINES</span>
            <span class="value" id="lines">0</span>
          </div>
          <div class="panel-section">
            <span class="label">LEVEL</span>
            <span class="value" id="level">1</span>
          </div>
        </div>

        <div class="panel-section">
          <span class="label">COMBO</span>
          <span class="value" id="combo">—</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>C</kbd><kbd>Shift</kbd> reservar</li>
            <li><kbd>E</kbd> habilidad</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="record-msg" class="record-msg hidden"></p>
        <form id="record-form" class="record-form hidden">
          <input id="record-name" type="text" maxlength="12" placeholder="Tu nombre" autocomplete="off" spellcheck="false" aria-label="Nombre para la tabla de récords" />
          <button type="submit" id="record-save" class="btn">Guardar</button>
        </form>
        <div id="over-records" class="records hidden"></div>
        <button id="restart-btn" class="btn">Reiniciar</button>
        <button id="mode-btn" class="btn secondary">Cambiar modo</button>
      </div>
    </div>

    <div id="mode-menu" class="overlay hidden">
      <div class="overlay-box menu-box">
        <p class="menu-title">ELIGE MODO</p>
        <div id="mode-list" class="menu-list"></div>
        <div id="menu-records" class="records"></div>
      </div>
    </div>

    <div id="ability-menu" class="overlay hidden">
      <div class="overlay-box menu-box">
        <p class="menu-title">HABILIDAD</p>
        <div id="ability-list" class="menu-list"></div>
        <p class="menu-hint"><kbd>1</kbd>–<kbd>4</kbd> elegir · <kbd>Esc</kbd> cancelar</p>
      </div>
    </div>
  </div>

  <script src="pieces.js"></script>
  <script src="audio.js"></script>
  <script src="scoring.js"></script>
  <script src="powerups.js"></script>
  <script src="modes.js"></script>
  <script src="abilities.js"></script>
  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
